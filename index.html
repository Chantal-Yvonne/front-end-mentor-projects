<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor Projects</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #222;
        line-height: 1.6;
        padding: 40px 20px;
    }

    main {
        max-width: 1000px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
    }

    h1 {
        margin-bottom: 10px;
    }

    .intro {
        margin-bottom: 30px;
        color: #666;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    th {
        background-color: #f0f0f0;
    }

    a {
        color: #0077cc;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        body {
            padding: 20px 10px;
        }

        main {
            padding: 20px;
        }

        th,
        td {
            padding: 10px 5px;
            font-size: 14px;
        }
    }
</style>

</head>
<body>


<main>

    <h1>Frontend Mentor Projects</h1>

    <p class="intro">
        A collection of Frontend Mentor challenges completed while
        developing my frontend development skills.
    </p>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Project</th>
                <th>Live Demo</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>01</td>
                <td>Interactive Rating Component</td>
                <td>
                    <a href="./Interactive-rating-component/">
                        Live Demo
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</main>

</body>
</html>
